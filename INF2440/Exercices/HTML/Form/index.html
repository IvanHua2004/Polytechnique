<!DOCTYPE html>
<html lang="fr">

<head>
  <title>Formulaire d'évaluation</title>
  <style>
    form {
      display: flex;
      flex-direction: column;
      width: 300px;
      border: 1px solid black;
      padding: 10px;
    }

    textarea {
      max-width: 100%;
      max-height: 100%;
      width: 100%;
    }

    #comment label {
      display: block;
    }

    input[type=text] {
      width: 100%;
    }

    button {
      width: 100%;
      align-items: center;
    }
  </style>
</head>

<body>
  <h1>Évaluez le produit</h1>

  <main>
    <form>
      <div id="eval">
        <div id="recommend">
          <section>
            <h3> Recommanderez-vous ce produit à d'autres clients ?</h3>
            <label id="oui">Oui</label>
            <input type="checkbox" id="checkboxoui" />
            <label id="non">Non</label>
            <input type="checkbox" id="checkboxnon" />
          </section>
        </div>
        <div id="rating">
          <h3>Donnez une note entre 1 et 5 :</h3>
          <select id="mySelection" name="selectionName">
            <option value="option1">Chosir</option>
            <option value="option2">1</option>
            <option value="option3">2</option>
            <option value="option4">3</option>
            <option value="option5">4</option>
            <option value="option6">5</option>
          </select>
        </div>
      </div>
      <div id="comment">
        <h3>Ajoutez un commentaire!</h3>
        <label>Titre:</label>
        <input type="text" id="titre" placeholder="Que faut-il savoir du produit?">
        <label>Message:</label>
        <textarea cols="60" rows="2"></textarea>
        <button class="button">Envoyer</button>
      </div>
    </form>
  </main>
</body>

</html>
