<!DOCTYPE html>
<html lang="fr">

<head>

    <title>PolyImages - Explorer</title>
    <link rel="icon shortcut" type="image/x-icon" href="assets/icons/favicon.ico">
    <link rel="stylesheet" href="assets/css/shared.css">
    <link rel="stylesheet" href="assets/css/index.css">
    <script type="module" src="assets/js/index.js" defer></script>

<body>
    <header>
        <h1>PolyImages&ensp;&ndash;&ensp;Explorer</h1>

        </section>
