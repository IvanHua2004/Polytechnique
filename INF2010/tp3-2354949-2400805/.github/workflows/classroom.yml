# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        id: build
        run: |
          ./gradlew build -x test
          if [ $? -eq 0 ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Test with Gradle
        if: steps.build.outputs.status == 'success'
        run: ./gradlew test
        continue-on-error: true

      - name: Calculate Grade
        run: |
          if [ "${{ steps.build.outputs.status }}" != "success" ]; then
            echo "GRADE=0" >> $GITHUB_ENV
            echo "Build or tests failed. Grade set to 0."
            exit 1
          else
            total_tests=$(grep -o '<testcase' build/test-results/test/TEST-*.xml | wc -l)
            failed_tests=$(grep -o '<failure' build/test-results/test/TEST-*.xml | wc -l)
            grade=$(awk "BEGIN {print int((($total_tests - $failed_tests)/$total_tests)*100)}")
            echo "Failed $failed_tests out of $total_tests tests. Grade: $grade%"
            echo "GRADE=$grade" >> $GITHUB_ENV
            exit $(test $failed_tests == 0)
          fi
